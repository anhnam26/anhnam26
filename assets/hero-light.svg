<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pham Hoa Anh Nam — AI Engineer</title>
  <desc id="desc">AI Engineer working on AI agents, RAG, LLM APIs, Local AI, ML/DL and production AI. An animated current-focus panel highlights these areas.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#c6d1c8" stroke-opacity=".4"/></pattern>
    <style>
      .sans{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
      .focus-highlight{animation:focus-list 18s ease-in-out infinite}.focus-cursor{animation:blink 1s steps(2,end) infinite}
      @keyframes focus-list{0%,12%{transform:translateY(0px);opacity:1}16.667%,28%{transform:translateY(28px)}33.333%,45%{transform:translateY(56px)}50%,62%{transform:translateY(84px)}66.667%,78%{transform:translateY(112px)}83.333%,95%{transform:translateY(140px);opacity:1}97%{transform:translateY(140px);opacity:0}98%{transform:translateY(0px);opacity:0}100%{transform:translateY(0px);opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.focus-highlight,.focus-cursor{animation:none}}
    </style>
    <clipPath id="clip"><rect width="1280" height="440" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="440" fill="#f5f7f2"/>
    <rect x="800" width="480" height="440" fill="url(#grid)"/>
    <path d="M800 0V440" stroke="#d0d9cf"/>
    <path d="M40 72H1240M40 368H1240" stroke="#d0d9cf"/>
    <circle cx="48" cy="40" r="5" fill="#236b51"/>
    <text x="66" y="45" fill="#236b51" font-size="16" letter-spacing="2" class="mono">ANHNAM26 / ENGINEERING LOG</text>
    <text x="1240" y="45" text-anchor="end" fill="#4f645b" font-size="14" class="mono">HO CHI MINH CITY, VN</text>
    <text x="48" y="120" fill="#4f645b" font-size="16" letter-spacing="3" class="mono">PHAM HOA ANH NAM</text>
    <text x="44" y="212" fill="#172f29" font-size="88" font-weight="650" letter-spacing="-3" class="sans">AI Engineer</text>
    <text x="44" y="278" fill="#236b51" font-size="48" font-weight="650" letter-spacing="-1.5" class="sans">AI agents. RAG. LLMs.</text>
    <text x="48" y="326" fill="#4f645b" font-size="19" class="sans">LLM APIs · Local AI · ML/DL · Production AI</text>
    <text x="48" y="410" fill="#4f645b" font-size="14" letter-spacing="1" class="mono">AI AGENTS · RAG · LLM APIs · LOCAL AI · ML/DL</text>
    <text x="1240" y="410" text-anchor="end" fill="#236b51" font-size="14" class="mono">AI APPLICATIONS / API &amp; LOCAL MODELS</text>
    <rect x="832" y="104" width="400" height="236" rx="10" fill="#f5f7f2" stroke="#d0d9cf"/>
    <path d="M832 146H1232" stroke="#d0d9cf"/>
    <circle cx="851" cy="125" r="4" fill="#91451f"/><circle cx="865" cy="125" r="4" fill="#4f645b"/><circle cx="879" cy="125" r="4" fill="#236b51"/>
    <text x="906" y="130" fill="#236b51" font-size="13" letter-spacing="1.5" class="mono">CURRENT FOCUS</text>
    <g class="focus-highlight">
      <rect x="848" y="154" width="368" height="26" rx="4" fill="#236b51" fill-opacity=".12"/>
      <path class="focus-cursor" d="M855 162L861 167L855 172" stroke="#236b51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="#4f645b" font-size="17" class="sans">
      <text x="878" y="173">AI agents</text><text x="878" y="201">Retrieval-augmented generation</text>
      <text x="878" y="229">LLM API integrations</text><text x="878" y="257">Local AI &amp; model inference</text>
      <text x="878" y="285">Machine learning &amp; deep learning</text><text x="878" y="313">Production AI applications</text>
    </g>
  </g>
</svg>
