<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pham Hoa Anh Nam — AI Engineer</title>
  <desc id="desc">AI Engineer. From models to production. Focused on AI agents, RAG, LLM APIs, Local AI and ML/DL. Ho Chi Minh City, Vietnam.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#263638" stroke-opacity=".4"/></pattern>
    <style>
      .sans{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
      .signal{stroke-dasharray:10 180;animation:flow 9s linear infinite}.orbit{transform-origin:1040px 214px;animation:orbit 48s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-380}}@keyframes orbit{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.signal,.orbit{animation:none}}
    </style>
    <clipPath id="clip"><rect width="1280" height="440" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="440" fill="#101b1d"/>
    <rect x="800" width="480" height="440" fill="url(#grid)"/>
    <path d="M800 0V440" stroke="#2c3e40"/>
    <path d="M40 72H1240M40 368H1240" stroke="#2c3e40"/>
    <circle cx="48" cy="40" r="5" fill="#9ee6c1"/>
    <text x="66" y="45" fill="#9ee6c1" font-size="16" letter-spacing="2" class="mono">ANHNAM26 / ENGINEERING LOG</text>
    <text x="1240" y="45" text-anchor="end" fill="#afc1c0" font-size="14" class="mono">HO CHI MINH CITY, VN</text>
    <text x="48" y="120" fill="#afc1c0" font-size="16" letter-spacing="3" class="mono">PHAM HOA ANH NAM</text>
    <text x="44" y="212" fill="#f1f6f2" font-size="88" font-weight="650" letter-spacing="-3" class="sans">AI Engineer</text>
    <text x="44" y="278" fill="#9ee6c1" font-size="48" font-weight="650" letter-spacing="-1.5" class="sans">AI agents. RAG. LLMs.</text>
    <text x="48" y="326" fill="#afc1c0" font-size="19" class="sans">LLM APIs · Local AI · ML/DL · Production AI</text>
    <text x="48" y="410" fill="#afc1c0" font-size="14" letter-spacing="1" class="mono">AI AGENTS · RAG · LLM APIs · LOCAL AI · ML/DL</text>
    <text x="1240" y="410" text-anchor="end" fill="#9ee6c1" font-size="14" class="mono">AI APPLICATIONS / API &amp; LOCAL MODELS</text>
    <g stroke="#3f6057">
      <path d="M870 138L960 168L1040 214L1140 142L1200 236L1140 306L1040 214L926 300L870 138Z"/>
