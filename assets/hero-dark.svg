      <circle cx="1040" cy="214" r="108" stroke-dasharray="2 9"/>
    </g>
    <circle class="orbit" cx="1040" cy="214" r="91" stroke="#9ee6c1" stroke-opacity=".65" stroke-dasharray="68 504"/>
    <path class="signal" d="M870 138L960 168L1040 214L1140 142L1200 236L1140 306L1040 214L926 300L870 138Z" stroke="#9ee6c1" stroke-width="2"/>
    <g fill="#101b1d" stroke="#9ee6c1" stroke-width="2">
      <circle cx="870" cy="138" r="7"/><circle cx="960" cy="168" r="7"/><circle cx="1140" cy="142" r="7"/><circle cx="1200" cy="236" r="7"/><circle cx="926" cy="300" r="7"/>
    </g>
    <circle cx="1140" cy="306" r="7" fill="#efb18a"/>
    <rect x="1008" y="182" width="64" height="64" rx="12" fill="#9ee6c1"/>
    <path d="M1026 228V200L1054 228V200" stroke="#101b1d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#afc1c0" font-size="12" letter-spacing="1.5" class="mono">
