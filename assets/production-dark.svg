<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="216" viewBox="0 0 1280 216" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">My direction in production AI</title>
  <desc id="desc">Build with ML/DL, ground with RAG, orchestrate agents, serve with APIs or local models, evaluate, deploy and monitor. Improve through feedback.</desc>
  <rect x=".5" y=".5" width="1279" height="215" rx="12" fill="#101b1d" stroke="#2c3e40"/>
  <text x="32" y="36" fill="#9ee6c1" font-family="Consolas,'Courier New',monospace" font-size="13" letter-spacing="2">MY ENGINEERING DIRECTION / FROM EXPERIMENT TO OPERATION</text>
  <g stroke="#2c3e40" fill="#101b1d">
    <rect x="32" y="64" width="184" height="108" rx="6"/>
    <rect x="238" y="64" width="184" height="108" rx="6"/>
    <rect x="444" y="64" width="184" height="108" rx="6"/>
    <rect x="650" y="64" width="184" height="108" rx="6"/>
    <rect x="856" y="64" width="184" height="108" rx="6"/>
    <rect x="1062" y="64" width="184" height="108" rx="6"/>
  </g>
  <g stroke="#9ee6c1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 118h10m-4-4 4 4-4 4M428 118h10m-4-4 4 4-4 4M634 118h10m-4-4 4 4-4 4M840 118h10m-4-4 4 4-4 4M1046 118h10m-4-4 4 4-4 4"/>
  </g>
  <g font-family="Consolas,'Courier New',monospace" font-size="12" fill="#9ee6c1">
    <text x="48" y="92">01 / BUILD</text><text x="254" y="92">02 / GROUND</text>
    <text x="460" y="92">03 / ORCHESTRATE</text><text x="666" y="92">04 / SERVE</text>
    <text x="872" y="92">05 / EVALUATE</text><text x="1078" y="92" fill="#efb18a">06 / OPERATE</text>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#f1f6f2">
    <text x="48" y="125">ML / DL</text><text x="254" y="125">RAG</text>
    <text x="460" y="125">AI agents</text><text x="666" y="125">API / Local</text>
    <text x="872" y="125">Measure</text><text x="1078" y="125">Production</text>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#afc1c0">
    <text x="48" y="151">Data · models · training</text><text x="254" y="151">Knowledge · retrieval</text>
    <text x="460" y="151">Tools · workflows</text><text x="666" y="151">Inference · integration</text>
    <text x="872" y="151">Quality · latency · cost</text><text x="1078" y="151">Deploy · monitor</text>
    <text x="32" y="199">Observe real use. Feed what you learn back into the next iteration.</text>
